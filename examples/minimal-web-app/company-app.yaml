schema_version: 1

app:
  slug: minimal-web-app
  name: Minimal Web App
  owner_email: owner@example.com
  description: Minimal Node.js web app example.

runtime:
  type: docker-compose
  compose_file: docker-compose.yml
  service: app
  healthcheck:
    type: http
    path: /health
    expected_status: 200

deploy:
  enabled: true
  domain: minimal-web-app.internal.example.com
  port: auto
  env_file: .env
  env_example: .env.example

auth:
  required: true
  provider: forward-auth
  allowed_domains:
    - example.com

database:
  required: false

checks:
  build_command: docker compose build
  test_command: npm test

